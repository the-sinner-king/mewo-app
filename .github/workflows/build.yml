name: Build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Build apk
        env:
          STORE_FILE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo $STORE_FILE | base64 -d > app/keystore.jks
          chmod +x gradlew 2>/dev/null || true
          gradle assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with: { name: mewo-apk, path: app/build/outputs/apk/debug/app-debug.apk }
